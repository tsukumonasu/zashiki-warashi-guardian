[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warashi-agent"
version = "0.1.0"
description = "Zashiki-Warashi Guardian — device agent for Raspberry Pi Zero W"
requires-python = ">=3.13"
dependencies = [
    # Installed via apt on the Pi:
    #   python3-gpiozero  python3-lgpio  python3-paho-mqtt
    # Listed here for documentation; use apt, not pip, on armv6l.
    "gpiozero",
    "paho-mqtt",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.112",
    "ruff>=0.4",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["warashi_agent*"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30          # seconds — no test should block on hardware
addopts = "--tb=short -q"

# ---------------------------------------------------------------------------
# Hypothesis
# ---------------------------------------------------------------------------
[tool.hypothesis]
# Keep the default database inside device/ so it is not shared with other parts.
database = ".hypothesis"

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]
ignore = [
    "E501", # line length is handled by the formatter, not the linter
]

[tool.ruff.lint.isort]
known-first-party = ["warashi_agent"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
