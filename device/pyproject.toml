[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warashi-agent"
version = "0.1.0"
description = "Zashiki-Warashi Guardian: device agent for a Raspberry Pi Zero W"
license = "MIT"
# Raspberry Pi OS on the doll ships Python 3.13.5.
requires-python = ">=3.13"
# No runtime dependencies are installed by pip. On the Pi they come from apt
# (python3-gpiozero, python3-lgpio, python3-paho-mqtt); see .kiro/steering/tech.md.
# Laptop tests use the fakes in warashi_agent/adapters/fakes.py instead.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.112",
    "ruff>=0.4",
    # Loopback server of the voice-conversation tests. On the Pi the runtime package comes from
    # apt (python3-websockets); pip never installs it there.
    "websockets>=13",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["warashi_agent*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# A test that waits on hardware or the network fails instead of hanging CI.
timeout = 30
addopts = "--tb=short -q"

[tool.ruff]
target-version = "py313"
line-length = 99

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
]

[tool.ruff.lint.isort]
known-first-party = ["warashi_agent"]
