# Cached voice lines for the zashiki-warashi.
#
# Each entry has:
#   id      — stable identifier used in speak commands and reaction.performed events
#   ja      — Japanese text spoken by the doll
#   en      — English subtitle shown on the dashboard
#
# Audio files (WAV, 16 kHz mono PCM) are generated by scripts/generate_voice_lines.*
# and stored alongside this file. They are excluded from git (.gitignore).
#
# Keep lines short: at most two sentences, about 40 Japanese characters total,
# so playback finishes quickly. No modern slang, no English words inside Japanese lines.

[[lines]]
id = "greeting_family"
ja = "おかえり。きょうも ぶじで よかった。"
en = "Welcome home. I'm glad you're safe today."

[[lines]]
id = "greeting_family_late"
ja = "もう おそいよ。はやく おやすみ。"
en = "It's late. Go to sleep soon."

[[lines]]
id = "warning_stranger_first"
ja = "……だあれ？ このいえの ひとじゃ ないね。"
en = "...Who are you? You don't belong to this house."

[[lines]]
id = "warning_stranger_watching"
ja = "……ずっと、みているよ。"
en = "...I have been watching, all along."

[[lines]]
id = "uncertain"
ja = "……だれか、いるの？"
en = "...Is someone there?"
