# Cached voice lines for the zashiki-warashi (device-core-loop R26).
# id: [a-z0-9_]+, unique. category: family | stranger | uncertain.
# wav: file name in this directory (16-bit PCM mono WAV, generated by scripts/generate_voice_lines.*,
# git-ignored). ja: at most 40 characters and two sentences, no Latin letters, no emoji.

[[lines]]
id = "greeting_family"
category = "family"
ja = "おかえり。きょうも ぶじで よかった。"
en = "Welcome home. I'm glad you're safe today."
wav = "greeting_family.wav"

[[lines]]
id = "greeting_family_late"
category = "family"
ja = "もう おそいよ。はやく おやすみ。"
en = "It's late. Go to sleep soon."
wav = "greeting_family_late.wav"

[[lines]]
id = "greeting_family_waited"
category = "family"
ja = "あ、かえってきた。ずっと まってたよ。"
en = "Oh, you're back. I was waiting for you."
wav = "greeting_family_waited.wav"

[[lines]]
id = "greeting_family_lantern"
category = "family"
ja = "あかり、ともしておいたよ。おかえり。"
en = "I kept the lantern lit for you. Welcome home."
wav = "greeting_family_lantern.wav"

[[lines]]
id = "warning_stranger_first"
category = "stranger"
ja = "……だあれ？ このいえの ひとじゃ ないね。"
en = "...Who are you? You don't belong to this house."
wav = "warning_stranger_first.wav"

[[lines]]
id = "warning_stranger_watching"
category = "stranger"
ja = "……ずっと、みているよ。"
en = "...I have been watching, all along."
wav = "warning_stranger_watching.wav"

[[lines]]
id = "warning_stranger_house"
category = "stranger"
ja = "……ここは、わたしの いえだよ。"
en = "...This house is mine."
wav = "warning_stranger_house.wav"

[[lines]]
id = "warning_stranger_footsteps"
category = "stranger"
ja = "……しらない あしおとが する。"
en = "...Those are footsteps I do not know."
wav = "warning_stranger_footsteps.wav"

[[lines]]
id = "uncertain"
category = "uncertain"
ja = "……だれか、いるの？"
en = "...Is someone there?"
wav = "uncertain.wav"

[[lines]]
id = "uncertain_shadow"
category = "uncertain"
ja = "……いま、かげが うごいた？"
en = "...Did a shadow just move?"
wav = "uncertain_shadow.wav"

[[lines]]
id = "uncertain_wind"
category = "uncertain"
ja = "……かぜの おと、かな。"
en = "...Was that only the wind?"
wav = "uncertain_wind.wav"
