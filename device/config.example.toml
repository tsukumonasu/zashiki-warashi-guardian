# config.example.toml — copy to config.toml and edit before first run.
# config.toml is excluded from git (see .gitignore).

[device]
id = "warashi-01"             # must match the IoT Core thing name

[motion]
# Set to true only after servos are verified and calibrated on the real doll.
# When false, all servo actions are logged but not executed.
motion_enabled = false

[servo]
# Calibrated center offsets (degrees). Adjust until the doll faces straight ahead.
pan_center_offset  = 0
tilt_center_offset = 0

# Safe travel limits from center. The config loader rejects values beyond
# pan ±60° / tilt ±30° (cable protection — see hardware.md).
pan_limit  = 30
tilt_limit = 20

# Flip direction if the servo is mounted in reverse.
pan_invert  = false
tilt_invert = false

[aws]
# IoT Core endpoint — found in the AWS console under IoT Core > Settings.
# Do not commit real values.
iot_endpoint = "xxxxxxxxxxxxxxx-ats.iot.ap-northeast-1.amazonaws.com"
iot_port     = 8883

# Paths to the device certificate and private key (on the Pi, not in the repo).
cert_path = "/home/pi/certs/device.crt"
key_path  = "/home/pi/certs/device.key"
ca_path   = "/home/pi/certs/AmazonRootCA1.pem"
