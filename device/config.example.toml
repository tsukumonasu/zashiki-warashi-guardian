# DRAFT. The real keys are decided in the device-core-loop design and enforced by config.py.
# Copy to config.toml on the Pi. config.toml is git-ignored and must never be committed.

[device]
id = "warashi-01"

[motion]
# Servo actions are only logged while this is false. Turn it on only after the
# servos are verified as 180-degree positional servos and calibrated on the real doll.
motion_enabled = false

[servo]
# Calibrated center per axis, in degrees (find it with tools/warashi_calib.py).
pan_center = 0
tilt_center = 0
# Allowed travel from the center. The loader rejects pan > 60 and tilt > 30
# (camera ribbon and servo leads run through the neck).
pan_limit = 30
tilt_limit = 20
# Flip the direction if a servo is mounted the other way round.
pan_invert = false
tilt_invert = false

[aws]
# Placeholders only. Real values stay on the Pi.
iot_endpoint = "<your-endpoint>-ats.iot.ap-northeast-1.amazonaws.com"
cert_path = "/path/to/device.crt"
key_path = "/path/to/device.key"
ca_path = "/path/to/AmazonRootCA1.pem"
